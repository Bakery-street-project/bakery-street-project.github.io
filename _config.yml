title: "Bakery Street Project"
description: "AI-agent engineering studio — research, prototypes, and production systems."
url: "https://bakery-street-project.github.io"
baseurl: ""
repository: "Bakery-street-project/bakery-street-project.github.io"

author:
  name: "Kiliaan Vanvoorden"
  email: "bakerstreetbandit@zohomail.eu"
  url: "https://github.com/BoozeLee"
  linkedin: "https://linkedin.com/in/kiliaanvanvoorden"

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

sass:
  style: compressed

feed:
  path: feed.xml

sitemap:
  priority: 0.5
  lastmod: 2026-01-01

defaults:
  -
    scope:
      path: ""
    values:
      layout: default
      author_profile: true

collections:
  notes:
    output: true
    permalink: /:collection/:slug/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - _site/
  - .github/
  - .git/
  - README.md

include:
  - _pages
  - _posts
  - _notes

# Social / SEO
social:
  name: "Kiliaan Vanvoorden"
  links:
    - https://github.com/BoozeLee
    - https://linkedin.com/in/kiliaanvanvoorden
    - mailto:bakerstreetbandit@zohomail.eu
